# GoReleaser configuration for XELYON CLI
version: 2

before:
  hooks:
    - go mod tidy
    - go fmt ./...
    - go test ./...

builds:
  - id: xelyon
    binary: xelyon
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64  # Windows ARM64は現状サポート外
    ldflags:
      - -s -w
      - -X github.com/susugadx/xelyon-cli/internal/version.Version={{.Version}}
      - -X github.com/susugadx/xelyon-cli/internal/version.Commit={{.Commit}}
      - -X github.com/susugadx/xelyon-cli/internal/version.Date={{.Date}}

archives:
  - id: xelyon
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - XELYON.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'README'
  groups:
    - title: Features
      regexp: '^feat:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix:'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: susugadx
    name: xelyon-cli
  draft: false
  prerelease: auto
  name_template: "XELYON CLI v{{.Version}}"
  header: |
    ## XELYON CLI v{{.Version}}

    高速・軽量なLLMコーディングアシスタント

    ### インストール方法
    ```bash
    # macOS (Homebrew)
    brew install susugadx/tap/xelyon

    # 手動インストール（全OS対応）
    # 1. 下記のAssetsから環境に合ったファイルをダウンロード
    # 2. 解凍してPATHに配置
    ```

    ### サポート環境
    - **Linux**: amd64, arm64
    - **macOS**: amd64 (Intel), arm64 (Apple Silicon)
    - **Windows**: amd64

  footer: |
    **Full Changelog**: https://github.com/susugadx/xelyon-cli/compare/{{.PreviousTag}}...{{.Tag}}

    **Documentation**: https://github.com/susugadx/xelyon-cli#readme

# Homebrew Tap configuration
brews:
  - name: xelyon
    repository:
      owner: susugadx
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/susugadx/xelyon-cli
    description: "高速・軽量なLLMコーディングアシスタント"
    license: MIT
    install: |
      bin.install "xelyon"
    test: |
      system "#{bin}/xelyon", "--version"
