# GoReleaser configuration for XELYON CLI
version: 2

before:
  hooks:
    - go mod tidy
    - go fmt ./...

builds:
  - id: xelyon
    binary: xelyon
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/susugadx/xelyon-cli/internal/version.Version={{.Version}}

archives:
  - id: xelyon
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - XELYON.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'README'

release:
  github:
    owner: susugadx
    name: xelyon-cli
  draft: false
  prerelease: auto
