# golangci-lint configuration (v2)
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m # 5分でタイムアウト
  go: "1.23" # Goのバージョン指定

linters:
  enable:
    - errcheck # エラーを無視してないかチェック
    - govet # Go公式の静的解析ツール
    - ineffassign # 使われない代入を検出
    - staticcheck # バグっぽいコードを検出
    - unused # 未使用の変数・関数を検出
  exclusions:
    paths:
      - vendor # vendorフォルダは無視
