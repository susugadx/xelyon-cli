# XELYON CLI Release Pipeline
#
# タグ（v*）がプッシュされたら自動リリース
# - マルチプラットフォームビルド（GoReleaser）
# - GitHub Releases に公開
# - Homebrew tap 更新

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================
  # リリース前の検証
  # ============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve Go version
      id: go-version
      run: |
        version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); toolchain = $2 } $1 == "go" && !gover { gover = $2 } END { print toolchain ? toolchain : gover }' go.mod)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # テストで使用する ripgrep と probe sandbox 用 bubblewrap を準備
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep bubblewrap
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    # リリース前にテスト実行
    - name: Run tests
      run: make release-test

    - name: Test npm wrapper
      working-directory: npm
      run: |
        npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        npm test
        npm pack --dry-run

    # セキュリティチェック（リリース前に必須）
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  # ============================================
  # リリース
  # ============================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate  # validate が成功したら実行

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 全履歴取得（変更ログ生成に必要）

    - name: Resolve Go version
      id: go-version
      run: |
        version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); toolchain = $2 } $1 == "go" && !gover { gover = $2 } END { print toolchain ? toolchain : gover }' go.mod)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    # GoReleaser でマルチプラットフォームビルド & リリース
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    - name: Publish npm wrapper
      working-directory: npm
      run: |
        if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
          echo "NPM_TOKEN is not configured; skipping npm publish."
          exit 0
        fi
        npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        npm test
        npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    # ビルド成果物を保存（デバッグ用）
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: dist/*
        retention-days: 90  # 90日間保持
