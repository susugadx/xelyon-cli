# XELYON CLI Release Pipeline
#
# タグ（v*）がプッシュされたら自動リリース
# - マルチプラットフォームビルド（GoReleaser）
# - GitHub Releases に公開
# - Homebrew tap 更新

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================
  # リリース前の検証
  # ============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    # リリース前にテスト実行
    - name: Run tests
      run: go test -p=2 -v -race -tags grammar_set_core ./...

    # セキュリティチェック（リリース前に必須）
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  # ============================================
  # リリース
  # ============================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate  # validate が成功したら実行

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 全履歴取得（変更ログ生成に必要）

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    # GoReleaser でマルチプラットフォームビルド & リリース
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    # ビルド成果物を保存（デバッグ用）
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: dist/*
        retention-days: 90  # 90日間保持
