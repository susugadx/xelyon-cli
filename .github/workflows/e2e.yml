# XELYON CLI E2E Tests
#
# 実際のLLM APIを使用するE2Eテスト。
# コスト制御のため週1回 + 手動実行のみ。
#
# 必要な Secrets:
# - OPENAI_API_KEY: OpenAI APIキー

name: E2E

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 0:00
  workflow_dispatch:       # 手動実行

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.repository == 'susugadx/xelyon-cli'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Go version
        id: go-version
        run: |
          version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); toolchain = $2 } $1 == "go" && !gover { gover = $2 } END { print toolchain ? toolchain : gover }' go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      # E2Eテストで search_code が使用する ripgrep
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Run E2E tests
        run: XELYON_E2E=1 go test ./e2e/ -v -timeout 300s
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
