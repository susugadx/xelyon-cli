# XELYON CLI CI/CD Pipeline
#
# このワークフローは以下を実行します:
# - ビルドとテスト（カバレッジ付き）
# - コード品質チェック（lint）
# - セキュリティスキャン
#
# トリガー: main ブランチへの push または PR

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # ビルドとテスト
  # ============================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Go modules をキャッシュして CI を高速化
      # go.sum が変わらなければキャッシュを再利用
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # 依存関係の整合性を確認
      - name: Verify dependencies
        run: go mod verify

      # go mod tidy で不要な依存がないか確認
      # 差分があれば CI 失敗（コミット忘れ防止）
      - name: Run go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # go fmt でフォーマットされているか確認
      # 差分があれば CI 失敗
      - name: Run go fmt
        run: |
          go fmt ./...
          git diff --exit-code

      # ビルド確認
      - name: Build
        run: go build -v -o xelyon

      # バイナリサイズチェック
      # 50MB を超えると警告（肥大化防止）
      - name: Check binary size
        run: |
          size=$(stat -c%s xelyon)
          echo "Binary size: $((size / 1024 / 1024))MB ($size bytes)"
          if [ $size -gt 52428800 ]; then
            echo "::warning::Binary size exceeds 50MB!"
          fi

      # テスト実行
      # -race: データ競合を検出
      # -coverprofile: カバレッジレポート出力
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      # カバレッジ閾値チェック
      # 47% 未満は CI 失敗
      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $coverage%"
          if [ $(echo "$coverage < 47" | bc -l) -eq 1 ]; then
            echo "::error::Coverage $coverage% is below 47% threshold"
            exit 1
          fi

      # Codecov にカバレッジをアップロード
      # PR でカバレッジの増減が見れる
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          fail_ci_if_error: false # Codecov 障害時も CI は続行

  # ============================================
  # Lint（コード品質チェック）
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # golangci-lint で静的解析
      # 様々な lint ツールをまとめて実行
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.1
          # 問題があってもレポートを出力
          args: --timeout=5m

  # ============================================
  # セキュリティスキャン
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # gosec: Go コードのセキュリティ問題を検出
      # - ハードコードされた認証情報
      # - SQL インジェクション
      # - パストラバーサル
      # - 危険な関数使用
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -fmt json -out gosec-results.json ./... || true
          gosec -quiet -exclude=G204,G304 ./... || true

      # govulncheck: 依存ライブラリの脆弱性チェック
      # Go 公式の脆弱性データベースを使用
      # Go stdlib の脆弱性は Go バージョンアップでしか修正できないため警告扱い
      - name: Run govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # セキュリティレポートをアーティファクトとして保存
      # 後から確認できる
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: gosec-results.json
          retention-days: 30

  # ============================================
  # ベンチマーク（パフォーマンス計測）
  # ============================================
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # ベンチマーク実行
      # -bench=.: 全てのベンチマークを実行
      # -benchmem: メモリ割り当ても計測
      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem ./... 2>&1 | tee benchmark.txt
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ベンチマーク結果を保存
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 30
