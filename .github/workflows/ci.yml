# XELYON CLI CI/CD Pipeline
#
# このワークフローは以下を実行します:
# - ビルドとテスト（カバレッジ付き）
# - コード品質チェック（lint）
# - セキュリティスキャン
#
# トリガー: main ブランチへの push または PR

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # ビルドとテスト
  # ============================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # テストで使用する ripgrep をインストール
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      # 依存関係の整合性を確認
      - name: Verify dependencies
        run: make ci-verify-deps

      # go mod tidy で不要な依存がないか確認
      # 差分があれば CI 失敗（コミット忘れ防止）
      - name: Run go mod tidy
        run: make ci-check-tidy

      # go fmt でフォーマットされているか確認
      # 差分があれば CI 失敗
      - name: Run go fmt
        run: make ci-check-fmt

      # ビルド確認
      - name: Build
        run: make ci-build

      # バイナリサイズチェック
      # 50MB を超えると警告（肥大化防止）
      - name: Check binary size
        run: make ci-check-binary-size

      # テスト実行
      # -race: データ競合を検出
      # -coverprofile: カバレッジレポート出力
      - name: Run tests
        run: |
          set -o pipefail
          if make ci-test 2>&1 | tee test.log; then
            exit 0
          fi

          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          log_path = Path("test.log")
          lines = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []

          def emit_error(title: str, body: str) -> None:
            escaped = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print(f"::error title={title}::{escaped}")

          def first_line_containing(needle: str) -> str | None:
            for line in lines:
              if needle in line:
                return line
            return None

          def first_line_matching_prefix(prefixes: tuple[str, ...]) -> str | None:
            for line in lines:
              if line.startswith(prefixes):
                return line
            return None

          highlights: list[tuple[str, str]] = []
          for matcher, title in [
            (lambda: first_line_containing("WARNING: DATA RACE"), "Data race detected"),
            (lambda: first_line_containing("panic:"), "Panic detected"),
            (lambda: first_line_containing("fatal error:"), "Fatal runtime error"),
            (lambda: first_line_containing("--- FAIL:"), "Failed test"),
            (lambda: first_line_containing("FAIL\tgithub.com/") or first_line_matching_prefix(("FAIL github.com/", "FAIL    github.com/")), "Failed package"),
            (lambda: first_line_matching_prefix(("# github.com/",)), "Build error"),
          ]:
            match = matcher()
            if match:
              highlights.append((title, match))

          if not highlights:
            tail = "\n".join(lines[-40:]) if lines else "test.log is empty"
            highlights.append(("Last 40 log lines", tail))

          for title, body in highlights[:5]:
            emit_error(title, body)

          print("::group::Test Failure Summary")
          for title, body in highlights[:5]:
            print(f"{title}: {body}")
          print("\n--- Last 80 log lines ---")
          tail = lines[-80:] if lines else ["test.log is empty"]
          print("\n".join(tail))
          print("::endgroup::")
          sys.stdout.flush()

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as f:
              f.write("## Test Failure Summary\n")
              for title, body in highlights[:5]:
                f.write(f"- {title}: `{body}`\n")
              f.write("\n### Log Tail\n\n```text\n")
              f.write("\n".join(tail))
              f.write("\n```\n")
          PY

          exit 1

      - name: Upload test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
          retention-days: 7

      # カバレッジ閾値チェック
      # 60% 未満は CI 失敗
      - name: Check coverage threshold
        run: make ci-check-coverage

      # Codecov にカバレッジをアップロード
      # PR でカバレッジの増減が見れる
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false # Codecov 障害時も CI は続行

  # ============================================
  # Lint（コード品質チェック）
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # golangci-lint で静的解析
      # 様々な lint ツールをまとめて実行
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.1
          # 問題があってもレポートを出力
          args: --timeout=5m

  # ============================================
  # セキュリティスキャン
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # gosec: Go コードのセキュリティ問題を検出
      # - ハードコードされた認証情報
      # - SQL インジェクション
      # - パストラバーサル
      # - 危険な関数使用
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -fmt json -out gosec-results.json ./... || true
          gosec -quiet -exclude=G204,G304 ./... || true

      # govulncheck: 依存ライブラリの脆弱性チェック
      # Go 公式の脆弱性データベースを使用
      # Go stdlib の脆弱性は Go バージョンアップでしか修正できないため警告扱い
      - name: Run govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # セキュリティレポートをアーティファクトとして保存
      # 後から確認できる
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: gosec-results.json
          retention-days: 30

  # ============================================
  # ベンチマーク（パフォーマンス計測）
  # ============================================
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # ベンチマーク実行
      # -bench=.: 全てのベンチマークを実行
      # -benchmem: メモリ割り当ても計測
      - name: Run benchmarks
        run: |
          go test -tags grammar_set_core -bench=. -benchmem ./... 2>&1 | tee benchmark.txt
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ベンチマーク結果を保存
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 30
