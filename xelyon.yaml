# xelyon-cli - Project Configuration
# AI 用コンテキスト。ドキュメントではありません。
# AI が許可なくこのファイルを肥大化させることを禁止します。

context: |
  Go製 AI コーディングアシスタント CLI。8 LLM プロバイダー対応（DeepSeek, OpenAI, Gemini, Claude, Ollama, Groq, OpenRouter, Bedrock）。
  Go 1.24+、Cobra（CLI）。

rules:
  - コミット前は make ci-check 必須（go fmt → build → lint → test）
  - 新機能・バグ修正時はテストも追加
  - エラーハンドリング必須（I/O 操作、HTTP には Timeout 設定）
  - コミットは日本語で機能単位で小さく、具体的に記述
  - 新機能追加時は README.md と docs/ を更新（バグ修正は不要）
  - 設定追加時は make gen-all を実行
  - 未使用コードは作らない（呼び出し元を確認してから実装）
  - 公開関数・型には日本語コメント必須（godoc 形式）

hooks:
  on_completion:
  on_step_complete: []
  timeout: 60
  max_retry: 3